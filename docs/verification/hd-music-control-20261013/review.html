<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武士傳說 · 遊戲內配樂控制比較</title>
<style>body{background:#1b1117;color:#eee1ca;font:18px/1.6 system-ui;margin:24px}main{max-width:1200px;margin:auto}button,a{font:inherit;color:#eee1ca}button{background:#64232a;border:1px solid #96764b;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{border-color:#f2cf82}canvas{display:block;width:100%;height:auto;margin-top:16px}a{color:#d4b070}output{display:block;margin-top:10px}audio{width:100%}.capture{margin:0}.capture main{max-width:none}.capture canvas{margin:0}.capture main>*:not(canvas){display:none}</style>
<main><h1>遊戲內配樂控制</h1><p>標題與旅店曲目已獲確認。這頁只比較開關方式，不執行遊戲規則或寫存檔；兩案都保留既有F10畫面設定。</p>
<p><button data-mode="independent" aria-pressed="true">A　配樂獨立開關，預設開啟</button> <button data-mode="theme">B　隨畫面：HD開／EGA關</button></p>
<p><button id="graphics">切換 EGA／HD 預覽</button> <button id="start">開始試聽旅店配樂</button></p>
<canvas width="1920" height="1200" tabindex="0"></canvas><output></output>
<p>A：下緣「配樂 開 F9」可用滑鼠或F9切換。換EGA／HD時繼續播放，不重頭開始。B：配樂跟隨畫面，EGA時停止；不另加配樂開關。兩案的開關都只影響本次遊玩，不改人物v3。</p>
<p>瀏覽器須按一次「開始試聽」才能出聲。正式遊戲不受這項瀏覽器限制。<a href="../../spec/004-ogg-audio-catalog.md#遊戲內配樂接入">接入契約</a> · <a href="../hd-music-20261012/review.html">已確認的兩首曲目</a></p>
<audio id="music" preload="metadata" src="../hd-music-20261012/inn.ogg" loop></audio></main>
<script>
const root=new URL('../../../',location.href),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),audio=document.querySelector('#music');
const state={mode:'independent',graphics:'hd',enabled:true,started:false};let font,egaFont;const images={};const files={hd:'docs/verification/hd-interface-runtime-20261012/inn-hd.png',ega:'docs/verification/hd-ui-theme-20261012/inn-ega.png',panel:'assets/hd/first-slice/interface/panel-192-48-0.png',font:'assets/hd/first-slice/interface/font-atlas.png',egaFont:'assets/ui-font/zh-hant-16.png'};if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
function identity(){return 'six/step-004; town7 x57 y8; unchanged party and command'}
function render(){ctx.imageSmoothingEnabled=false;ctx.drawImage(images[state.graphics],0,0,1920,1200);const text=state.mode==='theme'?'配樂隨HD':state.enabled?'配樂 開F9':'配樂 關F9';if(state.graphics==='hd'){ctx.imageSmoothingEnabled=true;ctx.drawImage(images.panel,1484,1148);const size=26,scale=size/64,w=Array.from(text).reduce((a,c)=>a+font.glyphs[c].advance*scale,0);let x=1500+(168-w)/2;const base=1158+(36-size)/2+size*.88;for(const ch of text){const g=font.glyphs[ch];ctx.drawImage(images.font,g.x,g.y,96,96,x-10*scale,base-76*scale,96*scale,96*scale);x+=g.advance*scale}}else{ctx.fillStyle='#d6b770';ctx.fillRect(1488,1152,192,48);ctx.fillStyle='#121a22';ctx.fillRect(1490,1154,188,44);const gs=new Map(egaFont.glyphs.map(g=>[g.character,g]));const w=Array.from(text).reduce((a,c)=>a+(gs.get(c)?.advance||16)*2,0);let x=1488+(192-w)/2;for(const ch of text){const g=gs.get(ch);if(g)ctx.drawImage(images.egaFont,g.sheet_column*16,g.sheet_row*18,16,18,x,1158,32,36);x+=(g?.advance||16)*2}}document.querySelector('output').textContent=(state.mode==='independent'?'A 獨立開關':'B 隨畫面')+' · '+state.graphics.toUpperCase()+' · 配樂'+(active()?'開':'關')+' · 場景與隊伍保持';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)))}
function active(){return state.mode==='theme'?state.graphics==='hd':state.enabled}
function sync(){if(state.started&&active())audio.play();else audio.pause();render()}
function graphics(){const before=identity();state.graphics=state.graphics==='hd'?'ega':'hd';sync();if(before!==identity())throw Error('scene changed')}
function toggle(){if(state.mode!=='independent')return;state.enabled=!state.enabled;sync()}
document.querySelector('#graphics').onclick=graphics;document.querySelector('#start').onclick=()=>{state.started=true;state.enabled=true;sync()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;sync()});
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1920/r.width,y=(e.clientY-r.top)*1200/r.height;if(x>=1488&&x<1680&&y>=1152&&y<1200)toggle()};document.onkeydown=e=>{if(e.key==='F9'){e.preventDefault();toggle()}};
Promise.all([fetch(new URL('assets/ui-font/manifest.json',root)).then(r=>r.json()).then(d=>egaFont=d.fonts[0]),fetch(new URL('assets/hd/first-slice/interface/font-atlas.json',root)).then(r=>r.json()).then(d=>font=d),...Object.entries(files).map(([k,v])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[k]=im;resolve()};im.onerror=reject;im.src=new URL(v,root)}))]).then(()=>{render();window.musicReview={state,identity,graphics,toggle,sync};document.body.dataset.ready='true'});window.addEventListener('pagehide',()=>audio.pause());
</script></html>
